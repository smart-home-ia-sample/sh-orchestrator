name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # sticky coverage comment on the PR

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # requirements-dev.txt pulls sh-common from its public GitHub tag.
      - run: pip install -r requirements-dev.txt

      # pytest-cov applies `fail_under` from pyproject.toml, so this step (and
      # the required "test / coverage" check) fails when coverage regresses.
      - name: Run tests with coverage
        run: |
          set -o pipefail
          python -m pytest \
            --cov=app --cov-report=term-missing --cov-report=xml \
            --junitxml=pytest.xml | tee pytest-coverage.txt

      - name: Coverage comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: MishaKav/pytest-coverage-comment@v1.1.53
        with:
          pytest-coverage-path: pytest-coverage.txt
          junitxml-path: pytest.xml
          title: Coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            pytest-coverage.txt
          retention-days: 14
