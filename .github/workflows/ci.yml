name: ci
on:
  push: { branches: [main] }
  pull_request:

jobs:
  # Builds the image on every PR (validates the Dockerfile); on main it also
  # pushes to GHCR. Tests/coverage live in test.yml, CodeQL in codeql.yml.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          # sh-common is public -> no token; GH_OWNER lets a fork build against its own.
          build-args: GH_OWNER=${{ github.repository_owner }}
